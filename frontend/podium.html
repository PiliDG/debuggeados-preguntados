<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debuggeadas - Podio</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-shell page-shell--lg">
      <section class="panel-card panel-card--wide">
        <header class="page-header">
          <p class="eyebrow">Final</p>
          <h1 class="glow-title">Podio</h1>
        </header>

        <section id="pantalla-podio" class="podio-layout">
          <div id="podio" class="podio-grid"></div>

          <div class="stats-grid">
            <article class="stats-card" id="stats-errores">
              <h3>Errores por categoría</h3>
              <ul id="lista-errores" class="stats-list"></ul>
            </article>

            <article class="stats-card" id="stats-tiempos">
              <h3>Tiempo de respuesta</h3>
              <ul id="lista-tiempos" class="stats-list"></ul>
            </article>

            <article class="stats-card" id="stats-campeones">
              <h3>Top 3</h3>
              <ul id="lista-campeones" class="stats-list"></ul>
            </article>
          </div>
        </section>

        <a href="/static/index.html" class="btn-menu btn-volver">Volver al menú</a>
      </section>
    </main>

    <script src="/static/podium.js?v=2"></script>
  </body>
</html>
