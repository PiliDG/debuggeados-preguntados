<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debuggeados - Administrar jugadores</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-shell page-shell--sm">
      <section class="panel-card panel-card--tight">
        <header class="page-header">
          <p class="eyebrow">Lobby</p>
          <h1 class="glow-title">Administrar jugadores</h1>
          <p class="muted">Capacidad máxima: 20 usuarios únicos.</p>
        </header>

        <form id="player-form" class="stack stack--sm" autocomplete="off">
          <label class="field-label" for="player-name">Nombre del jugador</label>
          <input
            id="player-name"
            type="text"
            placeholder="Ej: Pilar"
            maxlength="30"
            aria-label="Nombre del jugador"
          />
          <button id="btn-add" type="submit" class="btn-menu">Agregar</button>
        </form>

        <ul id="players-list" class="list player-list"></ul>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <a href="/static/index.html" class="btn-menu btn-volver">Volver al menú</a>
      </section>
    </main>

    <script src="/static/players.js"></script>
